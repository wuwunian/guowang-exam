name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: unzip -q guowang-exam-source.zip -d source && cd source/Guowang_Exam_Android_Project && gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: guowang-exam-debug-apk
          path: source/Guowang_Exam_Android_Project/app/build/outputs/apk/debug/app-debug.apk
