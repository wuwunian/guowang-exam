name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: unzip -q guowang-exam-source.zip -d source && cd source/Guowang_Exam_Android_Project && gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: guowang-exam-debug-apk
          path: source/Guowang_Exam_Android_Project/app/build/outputs/apk/debug/app-debug.apk
